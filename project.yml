name: GrayRecipes
options:
  bundleIdPrefix: com.vexindustries.grayrecipes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # <- set your Apple Developer Team ID here (or in Xcode Signing)
targets:
  GrayRecipes:
    type: application
    platform: iOS
    sources:
      - path: GrayRecipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vexindustries.grayrecipes
        INFOPLIST_FILE: GrayRecipes/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
